<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Profit & Price Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Futuristic neon glow effect */
        .neon-border {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }
        /* Smooth transition for showing results */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-cyan-500 selection:text-white">

    <div class="bg-gray-900 border border-cyan-500/40 p-8 rounded-2xl w-full max-w-lg neon-border transition-all duration-300">
        <h1 class="text-2xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 uppercase tracking-widest">
            Live Profit Calculator
        </h1>

        <!-- Inputs Section -->
        <div class="space-y-5">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Product Name (භාණ්ඩයේ නම)</label>
                <input type="text" id="productName" placeholder="Eg: Keyboard" 
                    class="calc-input w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-gray-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Total Cost (මුළු මුදල)</label>
                    <input type="number" id="totalCost" placeholder="Rs." 
                        class="calc-input w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-gray-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Quantity (ප්‍රමාණය)</label>
                    <input type="number" id="quantity" placeholder="Qty" 
                        class="calc-input w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-gray-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Profit per Item (එකකින් තියාගන්න ලාභය)</label>
                <input type="number" id="profitPerItem" placeholder="Rs." 
                    class="calc-input w-full bg-gray-950 border border-gray-700 rounded-lg p-2.5 text-gray-100 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
            </div>
        </div>

        <!-- Results Section -->
        <div id="resultsBox" class="mt-8 hidden fade-in">
            <h2 class="text-lg font-semibold text-gray-300 mb-4 border-b border-gray-700 pb-2">
                Results for : <span id="resName" class="text-cyan-400 uppercase tracking-wide"></span>
            </h2>
            
            <div class="space-y-4 text-sm bg-gray-950 p-5 rounded-lg border border-gray-800 shadow-inner">
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Cost per Item<br><span class="text-xs text-gray-600">(එකක මිල)</span></span>
                    <span id="resUnitCost" class="font-mono text-lg text-gray-300"></span>
                </div>
                
                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Selling Price per Item<br><span class="text-xs text-gray-600">(විකුණන මිල)</span></span>
                    <span id="resSellingPrice" class="font-mono text-lg text-blue-400"></span>
                </div>

                <div class="flex justify-between items-center">
                    <span class="text-gray-400">Total Revenue<br><span class="text-xs text-gray-600">(ලැබෙන මුළු මුදල)</span></span>
                    <span id="resTotalRevenue" class="font-mono text-lg text-purple-400"></span>
                </div>

                <div class="flex justify-between items-center pt-3 border-t border-gray-800">
                    <span class="text-gray-300 font-medium">Net Profit<br><span class="text-xs text-gray-500">(ඔබගේ ශුද්ධ ලාභය)</span></span>
                    <span id="resTotalProfit" class="font-mono text-2xl text-green-400 font-bold drop-shadow-[0_0_8px_rgba(74,222,128,0.5)] transition-all"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Select all input fields with the class 'calc-input'
        const inputs = document.querySelectorAll('.calc-input');

        // Add an event listener to each input to run the function whenever the user types
        inputs.forEach(input => {
            input.addEventListener('input', calculateProfitLive);
        });

        function calculateProfitLive() {
            // Get input values
            const name = document.getElementById('productName').value || 'Unnamed Product';
            const totalCost = parseFloat(document.getElementById('totalCost').value);
            const quantity = parseFloat(document.getElementById('quantity').value);
            const profitPerItem = parseFloat(document.getElementById('profitPerItem').value);
            const resultsBox = document.getElementById('resultsBox');

            // Check if all necessary numbers are provided and valid
            if (isNaN(totalCost) || isNaN(quantity) || isNaN(profitPerItem) || quantity <= 0) {
                // Hide results if data is incomplete
                resultsBox.classList.add('hidden');
                return;
            }

            // Core Logic Calculations
            const unitCost = totalCost / quantity;               
            const sellingPrice = unitCost + profitPerItem;       
            const totalRevenue = sellingPrice * quantity;        
            const totalProfit = totalRevenue - totalCost;        

            // Display Results
            document.getElementById('resName').textContent = name;
            document.getElementById('resUnitCost').textContent = 'Rs. ' + unitCost.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resSellingPrice').textContent = 'Rs. ' + sellingPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resTotalRevenue').textContent = 'Rs. ' + totalRevenue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById('resTotalProfit').textContent = 'Rs. ' + totalProfit.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            // Show the result box smoothly
            resultsBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
